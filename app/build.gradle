plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

android {
    namespace = 'com.gifboard'
    compileSdk = 34

    defaultConfig {
        applicationId = "com.gifboard"
        minSdk = 24
        targetSdk = 34
        versionCode = 4
        versionName = "v1.0.3"
    }

    signingConfigs {
        release {
            storeFile = file(System.getenv("KEYSTORE_FILE") ?: (project.findProperty('RELEASE_STORE_FILE') ?: "gifboard-release.jks"))
            storePassword = System.getenv("KEYSTORE_PASSWORD") ?: project.findProperty('RELEASE_STORE_PASSWORD')
            keyAlias = System.getenv("KEY_ALIAS") ?: project.findProperty('RELEASE_KEY_ALIAS')
            keyPassword = System.getenv("KEY_PASSWORD") ?: project.findProperty('RELEASE_KEY_PASSWORD')
        }
    }

    buildTypes {
        release {
            minifyEnabled = false
            // Disable VCS info for reproducible builds
            vcsInfo.include false
            // F-Droid strips signingConfigs, so we need to check if it exists
            try {
                if (signingConfigs.hasProperty('release') && signingConfigs.release.storeFile != null) {
                    signingConfig = signingConfigs.release
                }
            } catch (Exception ignored) {
                // Signing config not available (e.g., F-Droid build)
            }
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = '11'
    }
    packagingOptions {
        jniLibs {
            keepDebugSymbols += ['**/*.so']
        }
    }

    // Reproducibility fixes


}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.jsoup:jsoup:1.17.2'
    
    implementation 'com.facebook.fresco:fresco:3.6.0'
    implementation 'com.facebook.fresco:animated-gif:3.6.0'
    implementation 'com.facebook.fresco:imagepipeline-okhttp3:3.6.0'
    
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'androidx.preference:preference-ktx:1.2.1'
}

