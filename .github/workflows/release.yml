# GitHub Actions workflow for automated signed APK releases
## Triggers on version tags (v*) or manually via workflow_dispatch

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Tag/version to release (e.g. v1.0.5)'
        required: true
        default: 'v1.0.5'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || github.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install build-tools 34 for reproducible builds
        run: |
          sdkmanager "build-tools;34.0.0"

      - name: Decode Keystore
        shell: bash
        run: |
          set -euo pipefail
          # Use printf to avoid trailing newline issues with echo
          # tr -d removes any potential whitespace or line breaks from the secret
          printf '%s' "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | tr -d '\n\r ' | base64 --decode > /tmp/release.keystore
          test -s /tmp/release.keystore

      - name: Verify Keystore
        run: |
          # Quick sanity check to ensure the keystore is readable and the password is correct
          $JAVA_HOME/bin/keytool -list -keystore /tmp/release.keystore \
            -storepass "${{ secrets.RELEASE_STORE_PASSWORD }}" >/dev/null

      - name: Build Unsigned Release APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-configuration-cache --max-workers=1

      - name: Sign APK with apksigner from build-tools 34
        run: |
          # Find the release APK (handles both app-release.apk and app-release-unsigned.apk)
          UNSIGNED_APK=$(find app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          echo "Signing $UNSIGNED_APK"

          # Use apksigner from build-tools 34 for F-Droid reproducibility
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign \
            --ks /tmp/release.keystore \
            --ks-pass "pass:${{ secrets.RELEASE_STORE_PASSWORD }}" \
            --ks-key-alias "${{ secrets.RELEASE_KEY_ALIAS }}" \
            --key-pass "pass:${{ secrets.RELEASE_KEY_PASSWORD }}" \
            --out GifBoard-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || github.ref_name }}.apk \
            "$UNSIGNED_APK"

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: GifBoard-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || github.ref_name }}.apk
          generate_release_notes: true
          tag_name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || github.ref_name }}
          body: |
            ## GifBoard ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || github.ref_name }}
            
            A specialized GIF keyboard for Android.
            
            ### Installation
            1. Download the APK
            2. Enable "Install from unknown sources" if prompted
            3. Open the APK to install
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
